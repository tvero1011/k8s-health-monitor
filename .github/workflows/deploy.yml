name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t health-monitor:latest .
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-cluster
      - name: Load image into cluster
        run: kind load docker-image health-monitor:latest --name ci-cluster
      - name: Deploy with Helm
        run: helm upgrade --install health-monitor ./helm-chart --wait --timeout 120s
      - name: Show pods
        run: kubectl get pods
