apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-monitor
  template:
    metadata:
      labels:
        app: health-monitor
    spec:
      containers:
        - name: health-monitor
          image: health-monitor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000